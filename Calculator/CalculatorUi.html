<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Calculator UI</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>

  <!-- stylesheet link-->
   <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- Calculator -->
  <div class="calculator">

    <input
      type="text"
      id="display"
      class="form-control display"
      disabled
    />

    <div class="row g-2">

      <!-- Row 1 -->
      <div class="col-3">
        <button class="btn btn-secondary w-100" onclick="clearDisplay()">
          C
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-warning w-100" onclick="appendValue('/')">
          /
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-warning w-100" onclick="appendValue('*')">
          *
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-primary w-100" onclick="appendValue('%')">
          %
        </button>
      </div>



      <!-- Row 2 -->
      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('7')">
          7
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('8')">
          8
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('9')">
          9
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-warning w-100" onclick="appendValue('-')">
          -
        </button>
      </div>

      <!-- Row 3 -->
      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('4')">
          4
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('5')">
          5
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('6')">
          6
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-warning w-100" onclick="appendValue('+')">
          +
        </button>
      </div>


      

      <!-- Row 4 -->
      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('1')">
          1
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('2')">
          2
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('3')">
          3
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-danger w-100" onclick="deleteLast()">
          ⌫
        </button>
      </div>

      <!-- Row 5 -->
      <div class="col-6">
        <button class="btn btn-light w-100" onclick="appendValue('0')">
          0
        </button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" onclick="appendValue('.')">
          .
        </button>
      </div>
      
      <div class="col-3">
        <button class="btn btn-success w-100" onclick="calculate()">
          =
        </button>
      </div>
      
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Rahul Kumar. All Rights Reserved.</p>

      <div class="social-icons">
        <a href="https://github.com/Tech-Codes" target="_blank">
          <i class="fa fa-github"></i>
        </a>
        <a href="#" target="_blank">
          <i class="fa fa-Linkdin"></i>
        </a>
      </div>
    </div>
  </footer>

  <!-- JavaScript link-->
  <script>
    function appendValue(value) {
      document.getElementById("display").value += value;
    }

    function clearDisplay() {
      document.getElementById("display").value = "";
    }

    function deleteLast() {
      let display = document.getElementById("display");
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      let display = document.getElementById("display");

      try {
        display.value = eval(display.value);
      } catch {
        display.value = "Error";
      }
    }
  </script>

</body>
</html>
