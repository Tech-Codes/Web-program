    <div id="gameResult"></div>
</div>

<button onclick="newGame()">🔄 New Game</button>
<button onclick="undoMove()" id="undoBtn" disabled>↶ Undo</button>

<script>
class ChessGame {
    constructor() {
        this.board = this.initBoard();
        this.selectedSquare = null;
        this.validMoves = [];
        this.moveHistory = [];
        this.currentPlayer = 'white';
        this.gameOver = false;
        this.moveCount = 0;
        this.render();
        this.updateStatus();
    }

    initBoard() {
        return [
            ['♜','♞','♝','♛','♚','♝','♞','♜'],
            ['♟','♟','♟','♟','♟','♟','♟','♟'],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            ['♙','♙','♙','♙','♙','♙','♙','♙'],
            ['♖','♘','♗','♕','♔','♗','♘','♖']
        ];
    }

    render() {
        const boardEl = document.getElementById('chessBoard');
        boardEl.innerHTML = '';
        
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                square.className = `chess-square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                square.dataset.row = row;
                square.dataset.col = col;
                square.textContent = this.board[row][col] || '';
                
                square.addEventListener('click', () => this.handleSquareClick(row, col));
                boardEl.appendChild(square);
            }
        }
        this.highlightValidMoves();
    }

    handleSquareClick(row, col) {
        if (this.gameOver || this.currentPlayer === 'black') return;
        
        const piece = this.board[row][col];
        
        if (this.selectedSquare) {
            if (this.isValidMove(this.selectedSquare.row, this.selectedSquare.col, row, col)) {
                this.makeMove(this.selectedSquare.row, this.selectedSquare.col, row, col);
                this.aiMove();
            }
            this.selectedSquare = null;
        } else if (piece && this.isWhitePiece(piece)) {
            this.selectedSquare = { row, col };
        }
        
        this.render();
        this.updateStatus();
    }

    isWhitePiece(piece) {
        return piece && piece === piece.toUpperCase();
    }

    isValidMove(fromRow, fromCol, toRow, toCol) {
        if (this.selectedSquare && (fromRow !== this.selectedSquare.row || fromCol !== this.selectedSquare.col)) return false;
        
        const piece = this.board[fromRow][fromCol];
        const target = this.board[toRow][toCol];
        
        if (!piece || !this.isWhitePiece(piece)) return false;
        if (target && this.isWhitePiece(target)) return false;
        
        // Simple movement rules (simplified for README)
        const rowDiff = Math.abs(toRow - fromRow);
        const colDiff = Math.abs(toCol - fromCol);
        
        switch (piece.toLowerCase()) {
            case '♙': return toCol === fromCol && rowDiff === 1 && !target;
            case '♖': return (toRow === fromRow || toCol === fromCol) && !this.isPathBlocked(fromRow, fromCol, toRow, toCol);
            case '♘': return (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);
            case '♗': return rowDiff === colDiff && !this.isPathBlocked(fromRow, fromCol, toRow, toCol);
            case '♕': return (rowDiff === colDiff || toRow === fromRow || toCol === fromCol) && !this.isPathBlocked(fromRow, fromCol, toRow, toCol);
            case '♔': return rowDiff <= 1 && colDiff <= 1;
            default: return false;
        }
    }

    isPathBlocked(fromRow, fromCol, toRow, toCol) {
        const rowStep = toRow > fromRow ? 1 : -1;
        const colStep = toCol > fromCol ? 1 : -1;
        let r = fromRow + rowStep;
        let c = fromCol + colStep;
        
        while (r !== toRow || c !== toCol) {
            if (this.board[r][c]) return true;
            r += rowStep;
            c += colStep;
        }
        return false;
    }

    makeMove(fromRow, fromCol, toRow, toCol) {
        const move = {
            from: {row: fromRow, col: fromCol},
            to: {row: toRow, col: toCol},
            piece: this.board[fromRow][fromCol],
            captured: this.board[toRow][toCol]
        };
        
        this.moveHistory.push(move);
        this.board[toRow][toCol] = this.board[fromRow][fromCol];
        this.board[fromRow][fromCol] = null;
        this.currentPlayer = 'black';
        this.moveCount++;
        
        // Simple checkmate detection
        if (this.isCheckmate('white')) {
            this.endGame('♛ Black Wins!');
        } else if (this.moveCount > 50) {
            this.endGame('🤝 Draw!');
        }
    }

    aiMove() {
        // Simple AI - random valid move for black
        const validMoves = [];
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (this.board[r][c] && !this.isWhitePiece(this.board[r][c])) {
                    for (let tr = 0; tr < 8; tr++) {
                        for (let tc = 0; tc < 8; tc++) {
                            if (this.isValidMove(r, c, tr, tc)) {
                                validMoves.push({fromR: r, fromC: c, toR: tr, toC: tc});
                            }
                        }
                    }
                }
            }
        }
        
        if (validMoves.length > 0) {
            const move = validMoves[Math.floor(Math.random() * validMoves.length)];
            setTimeout(() => {
                this.makeMove(move.fromR, move.fromC, move.toR, move.toC);
                this.currentPlayer = 'white';
                this.render();
                this.updateStatus();
            }, 500);
        }
    }

    highlightValidMoves() {
        if (!this.selectedSquare) return;
        
        document.querySelectorAll('.chess-square').forEach(square => {
            const row = parseInt(square.dataset.row);
            const col = parseInt(square.dataset.col);
            
            if (this.isValidMove(this.selectedSquare.row, this.selectedSquare.col, row, col)) {
                square.classList.add(this.board[row][col] ? 'capture' : 'valid-move');
            }
        });
    }

    isCheckmate(player) {
        // Simplified checkmate detection
        return Math.random() < 0.1; // 10% chance for demo
    }

    endGame(message) {
        this.gameOver = true;
        document.getElementById('gameResult').innerHTML = message;
    }

    updateStatus() {
        document.getElementById('currentPlayer').textContent = this.currentPlayer === 'white' ? 'White ♔' : 'Black ♚';
        document.getElementById('moveCount').textContent = this.moveCount;
        document.getElementById('gameStatus').textContent = 
            this.gameOver ? '🏁 Game Over!' : 
            (this.currentPlayer === 'white' ? '⚪ White\'s Turn' : '⚫ AI Thinking...');
        document.getElementById('undoBtn').disabled = this.moveHistory.length === 0 || this.currentPlayer === 'black';
    }

    newGame() {
        Object.assign(this, new ChessGame());
    }

    undoMove() {
        if (this.moveHistory.length > 0 && this.currentPlayer === 'white') {
            const lastMove = this.moveHistory.pop();
            this.board[lastMove.from.row][lastMove.from.col] = lastMove.piece;
            this.board[lastMove.to.row][lastMove.to.col] = lastMove.captured;
            this.currentPlayer = 'black';
            this.moveCount--;
            this.gameOver = false;
            this.render();
            this.updateStatus();
        }
    }
}

let game = new ChessGame();

function newGame() { game.newGame(); }
function undoMove() { game.undoMove(); }
</script>

</div>

