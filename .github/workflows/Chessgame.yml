## 🎯 How to Play
1. **Click "Play Chess vs AI"** to start
2. **Select your piece** (White ♔ pieces)
3. **Click destination square** (Green = valid, Red = capture)
4. **AI responds automatically** (Black ♚)
5. **Win by checkmate** or survive 50 moves!

